<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEpusdt 一款更好用的个人加密货币收款网关</title>
    <link rel="shortcut icon" href="/checkout/official/assets/img/bepusdt.svg">
    <link rel="stylesheet" href="/checkout/official/assets/css/checkout.css">
    <script src="/checkout/official/assets/js/jquery.min.js"></script>
    <script src="/checkout/official/assets/js/jquery.qrcode.min.js"></script>
    <script src="/checkout/official/assets/js/i18next.min.js"></script>
    <script src="/checkout/official/assets/js/checkout.js"></script>
</head>
<body>
<div class="checkout-card" id="selectionStage" style="display:none;">
    <div class="card-header">
        <div class="brand"></div>
        <a id="helpBtnS" href="#" class="help-btn" data-i18n="[title]helpTitle" title="联系客服" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </a>
    </div>
    <div class="amount-block">
        <div class="amount-fiat">
            <span id="orderMoneyS">--</span>&nbsp;<span id="orderFiatS">--</span>
        </div>
        <div class="amount-crypto-row" style="display:none;">
            <span class="amount-crypto-value" id="payAmountCrypto"></span>
            <span class="copy-trigger" id="copyAmountBtn" data-i18n="[title]copyAmountTitle" title="复制金额">
                <span class="copy-trigger-icon" id="copyAmountIcon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </span>
            </span>
        </div>
        <div class="amount-network-line" id="networkTagSep" style="display:none;">
            <span class="network-tag" id="payNetworkTag"></span>
        </div>
    </div>
    <div style="padding: 12px 24px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div class="fee-notice">
            <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm.75 10.5h-1.5v-5h1.5v5zm0-6.5h-1.5V3.5h1.5V5z"/>
            </svg>
            <span data-i18n="feeNotice">请严格按照数额进行付款</span>
        </div>
        <div class="timer-badge-wrap">
            <div class="timer-badge">
                <span class="timer-label" data-i18n="timerLabel">到期时间</span>
                <span class="timer-text" id="timerDisplay">--:--:--</span>
            </div>
            <svg class="timer-ring" aria-hidden="true">
                <rect class="timer-ring-track" x="0.75" y="0.75" rx="7.25" ry="7.25" pathLength="100"/>
                <rect class="timer-ring-bar" x="0.75" y="0.75" rx="7.25" ry="7.25" pathLength="100"/>
            </svg>
        </div>
    </div>
    <div class="divider"></div>
    <div class="order-info">
        <div class="order-row">
            <span class="order-label" data-i18n="merchantOrder">商户订单</span>
            <span class="order-value" id="orderIdS">--</span>
        </div>
    </div>
    <div class="divider"></div>
    <div class="form-section">
        <label class="form-label" data-i18n="currencyLabel">货币</label>
        <div class="custom-select" id="currencySelect">
            <div class="select-trigger">
                <span class="select-text placeholder" data-i18n="selectCurrency">选择货币</span>
                <svg class="select-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <div class="select-dropdown"></div>
        </div>
        <label class="form-label" data-i18n="networkLabel">网络</label>
        <div class="custom-select" id="networkSelect">
            <div class="select-trigger">
                <span class="select-text placeholder" data-i18n="selectNetwork">选择网络</span>
                <svg class="select-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <div class="select-dropdown"></div>
        </div>
    </div>
    <div class="pay-btn-wrap">
        <button class="pay-btn" id="payBtn" disabled data-i18n="payBtn">继续付款</button>
    </div>
</div>
<div class="checkout-card" id="paymentStage" style="display:none;">
    <div class="card-header">
        <div class="brand"></div>
        <a id="helpBtnQ" href="#" class="help-btn" data-i18n="[title]helpTitle" title="联系客服" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </a>
    </div>
    <div class="amount-block">
        <div class="amount-crypto-row">
            <span class="amount-crypto-value" id="payAmountQ"></span>
            <span class="copy-trigger" id="copyAmountQBtn" data-i18n="[title]copyAmountTitle" title="复制金额">
                <span class="copy-trigger-icon" id="copyAmountQIcon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </span>
            </span>
        </div>
        <div class="amount-meta-row">
            <div class="amount-fiat">
                <span id="orderMoneyQ">--</span>&nbsp;<span id="orderFiatQ">--</span>
            </div>
            <div class="amount-network-line">
                <span class="network-tag" id="payNetworkQ">--</span>
            </div>
        </div>
    </div>
    <div style="padding: 12px 24px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div class="fee-notice">
            <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm.75 10.5h-1.5v-5h1.5v5zm0-6.5h-1.5V3.5h1.5V5z"/>
            </svg>
            <span data-i18n="feeNotice">请严格按照数额进行付款</span>
        </div>
        <div class="timer-badge-wrap">
            <div class="timer-badge">
                <span class="timer-label" data-i18n="timerLabel">到期时间</span>
                <span class="timer-text" id="timerDisplayQ">--:--:--</span>
            </div>
            <svg class="timer-ring" aria-hidden="true">
                <rect class="timer-ring-track" x="0.75" y="0.75" rx="7.25" ry="7.25" pathLength="100"/>
                <rect class="timer-ring-bar" x="0.75" y="0.75" rx="7.25" ry="7.25" pathLength="100"/>
            </svg>
        </div>
    </div>
    <div class="divider"></div>
    <div class="order-info">
        <div class="order-row">
            <span class="order-label" data-i18n="merchantOrder">商户订单</span>
            <span class="order-value" id="orderIdQ">--</span>
        </div>
    </div>
    <div class="divider"></div>
    <div class="qr-stage">
        <div class="qr-wrapper">
            <div id="qrcode"></div>
            <div class="qr-payment-logo" id="qrPaymentLogo" aria-hidden="true" style="display:none;">
                <img class="qr-token-logo" id="qrTokenLogo" alt="">
                <img class="qr-network-logo" id="qrNetworkLogo" alt="" style="display:none;">
            </div>
        </div>
        <div class="address-card">
            <div class="address-label-row">
                <span class="address-label" id="addressLabelQ" data-i18n="receivingAddress">收款地址</span>
                <span class="copy-trigger" id="copyAddressBtn" data-i18n="[title]copyAddressTitle" title="复制地址">
                    <span class="copy-trigger-icon" id="copyAddressIcon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </span>
                </span>
            </div>
            <div class="address-value" id="walletAddress">--</div>
        </div>
        <button class="reselect-btn" id="reselectPaymentBtn" type="button" style="display:none;" data-i18n="reselectPayment">
            选错了付款方式？返回重选
        </button>
    </div>
</div>
<div id="cmusToast" class="toast"></div>
<div id="successModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <div class="modal-body">
            <div class="success-icon-wrap">
                <svg class="success-checkmark" viewBox="0 0 52 52">
                    <circle class="success-checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="success-checkmark-check" fill="none" d="M14 27 l8 8 l16-16"/>
                </svg>
            </div>
            <h2 class="modal-title" data-i18n="paymentSuccess">支付成功！</h2>
            <p class="modal-subtitle" data-i18n="paymentSuccessSubtitle">您的付款已确认，交易已完成</p>
            <div id="txHashSection" class="tx-hash-card" style="display:none;">
                <div class="tx-hash-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span data-i18n="onChainDetails">链上详情</span>
                </div>
                <a id="txHashLink" href="#" target="_blank" class="tx-hash-value" style="text-decoration:none;">
                    <span class="tx-hash-text" id="txHashDisplayText"></span>
                    <svg class="tx-copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="7" y1="17" x2="17" y2="7"/>
                        <polyline points="7 7 17 7 17 17"/>
                    </svg>
                </a>
            </div>
            <a href="#" id="returnBtn" class="return-btn" data-i18n="returnBtn">返回商户平台</a>
        </div>
    </div>
</div>
<div id="confirmingModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <div class="modal-body">
            <div class="confirming-spinner"></div>
            <h2 class="modal-title" data-i18n="confirmingTitle">交易确认中</h2>
            <p class="modal-subtitle" data-i18n="confirmingSubtitle">检测到付款，区块链网络确认中...</p>
            <p class="confirming-note" data-i18n="confirmingNote">预计确认时间：1-3 分钟</p>
        </div>
    </div>
</div>
</body>
</html>
